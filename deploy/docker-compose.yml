# Run the game and open http://localhost:8088
#
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml logs -f xenomit
#
# Put preloader.swf and main.swf in ./client (repo root). They are served at
# /spacemap/preloader.swf and /spacemap/main.swf.
#
# Postgres, Redis, NATS, and Kafka are optional. The process runs without them.
# Start that profile with: docker compose -f deploy/docker-compose.yml --profile infra up
services:
  xenomit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
      - "9338:9338"
      - "843:843"
      - "8088:8088"
    environment:
      GAME_ADDR: ":8080"
      CHAT_ADDR: ":9338"
      POLICY_ADDR: ":843"
      HTTP_ADDR: ":8088"
      CLIENT_ROOT: /client
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ../client:/client:ro
    cap_add:
      - NET_BIND_SERVICE

  postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xenomit
      POSTGRES_PASSWORD: xenomit
      POSTGRES_DB: xenomit
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    profiles: ["infra"]
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"

  kafka:
    profiles: ["infra"]
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
