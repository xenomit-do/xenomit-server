# Declarative v10 catalog. cmd/protogen turns flat entries into Go.
# Nested modules (ship create, assets) stay hand-written in pkg/protocol/v10.
commands:
  - name: LoginRequest
    id: 10996
    direction: in
    fields:
      - { name: instanceId, type: int, left: 8, right: 24 }
      - { name: userId, type: int, left: 8, right: 24 }
